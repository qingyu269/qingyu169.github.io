<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>标签类型</title>
    <style>
        .top{
            height: 60px;
            background-color:white;
            margin: 10px auto;
        }
        #nav{
            width: 270px;
            height: 129px;
            background-color: white;
            margin: 0 auto;
        }
        .nav_top{
            font-size: 14px;
            color: #000;
            padding-left: 20px;
            padding-top: 23px;
        }
        #nav img{
            width: 270px;
            height: 129px;
        }
        .nav_top a{
            text-decoration: none;
            font-family: arial;
        }
        .nav_top a:link{
            color: #222;
        }
        .nav_top a:hover{
            color:blue;
            text-decoration: underline;
        }
        .form{
            width:680px;
            height: 80px;
            border: 1px solid blue;
            margin: 15px auto 5px auto;
        }
        .main{
            width: 1200px;
            height: 80px;
            border: 2px solid brown;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <div class="top">
    <span class="nav_top"><a href="#">新闻</a></span>
    <span class="nav_top"><a href="#">hao123</a></span>
    <span class="nav_top"><a href="#">地图</a></span>
    <span class="nav_top"><a href="#">贴吧</a></span>
    <span class="nav_top"><a href="#">视频</a></span>
    <span class="nav_top"><a href="#">图片</a></span>
    <span class="nav_top"><a href="#">网盘</a></span>
    <span class="nav_top"><a href="#">库库AI</a></span>
    <span class="nav_top"><a href="#">文心</a></span> 
    <span class="nav_top"><a href="#">百度搭子</a></span> 
    <div id="nav">
            <img src="baidu_logo.png"/>
    </div>
    <div>
        <div class="form">
            内容待定
        </div>
    </div>
    <div>
        <div class="main">
            内容待定
        </div>
    </div>
</body>
</html>
